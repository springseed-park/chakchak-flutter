<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="착착 Flutter 로컬 미리보기">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="착착">
  <title>착착 CHAKCHAK — Flutter</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fffcf7;
    }
    #app-loading {
      min-height: 100%;
      display: grid;
      place-content: center;
      color: #212b38;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">착착을 불러오고 있어요.</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister();
        });
      });
    }
    const bootstrap = document.createElement('script');
    bootstrap.src = `flutter_bootstrap.js?v=${Date.now()}`;
    bootstrap.async = true;
    document.body.appendChild(bootstrap);
  </script>
</body>
</html>
