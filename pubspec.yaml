name: chakchak
description: CHAKCHAK is a weather and schedule-aware wardrobe assistant built with Flutter.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters/
    - assets/garments/
    - assets/icons/
  fonts:
    - family: Paperlogy
      fonts:
        - asset: assets/fonts/Paperlogy-4Regular.ttf
          weight: 400
        - asset: assets/fonts/Paperlogy-5Medium.ttf
          weight: 500
        - asset: assets/fonts/Paperlogy-6SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Paperlogy-7Bold.ttf
          weight: 700
        - asset: assets/fonts/Paperlogy-8ExtraBold.ttf
          weight: 800
